services:
  db:
    image: cockroachdb/cockroach:v25.2.4
    command: start-single-node --insecure --cache=64MiB --max-sql-memory=128MiB
    ports: ['127.0.0.1:26267:26257', '127.0.0.1:18081:8080']
    volumes: ['gateway-db:/cockroach/cockroach-data']
    healthcheck:
      test: ['CMD', 'cockroach', 'sql', '--insecure', '--execute', 'SELECT 1']
      interval: 5s
      timeout: 5s
      retries: 15
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.2
    profiles: ['identity']
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: local-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-demo-only-change-before-deployment
    ports: ['127.0.0.1:8080:8080']
    volumes: ['./deploy/keycloak-realm.json:/opt/keycloak/data/import/gateway.json:ro']
volumes:
  gateway-db:
